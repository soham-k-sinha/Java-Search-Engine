<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMass Housing Search</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif&display=swap">
<style>
:root {
  --text: #1a1a2e;
  --text-secondary: #64646e;
  --ground: #f8f7f5;
  --surface: #fafaf9;
  --border: #e2e0dc;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --input-bg: #ffffff;
  --tag-bg: #f0eeeb;
  --tag-text: #4a4a54;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --text: #e4e4e7;
    --text-secondary: #9898a4;
    --ground: #141418;
    --surface: #1e1e24;
    --border: #2e2e36;
    --accent: #60a5fa;
    --accent-hover: #93bbfd;
    --input-bg: #1a1a20;
    --tag-bg: #26262e;
    --tag-text: #a0a0ac;
  }
}

:root[data-theme="dark"] {
  --text: #e4e4e7;
  --text-secondary: #9898a4;
  --ground: #141418;
  --surface: #1e1e24;
  --border: #2e2e36;
  --accent: #60a5fa;
  --accent-hover: #93bbfd;
  --input-bg: #1a1a20;
  --tag-bg: #26262e;
  --tag-text: #a0a0ac;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--ground);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding: 0 20px;
}

.container {
  max-width: 680px;
  margin: 0 auto;
  padding-block: 80px 120px;
}

header {
  margin-bottom: 48px;
}

h1 {
  font-family: 'Instrument Serif', Georgia, serif;
  font-weight: 400;
  font-size: 2.4rem;
  letter-spacing: -0.02em;
  line-height: 1.15;
  text-wrap: balance;
  margin-bottom: 8px;
}

.subtitle {
  color: var(--text-secondary);
  font-size: 0.95rem;
}

.search-form {
  display: flex;
  gap: 8px;
  margin-bottom: 40px;
}

.search-input {
  flex: 1;
  padding: 12px 16px;
  font-family: inherit;
  font-size: 0.95rem;
  color: var(--text);
  background: var(--input-bg);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  outline: none;
  transition: border-color 0.15s;
}

.search-input:focus {
  border-color: var(--accent);
}

.search-input::placeholder {
  color: var(--text-secondary);
  opacity: 0.7;
}

.search-btn {
  padding: 12px 24px;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 500;
  color: #fff;
  background: var(--accent);
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}

.search-btn:hover {
  background: var(--accent-hover);
}

.search-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.results-header {
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.result-list {
  display: flex;
  flex-direction: column;
}

.result {
  padding: 20px 0;
  border-top: 1px solid var(--border);
}

.result:last-child {
  border-bottom: 1px solid var(--border);
}

.result-address {
  font-size: 1.05rem;
  font-weight: 500;
  line-height: 1.35;
  margin-bottom: 4px;
}

.result-address a {
  color: var(--text);
  text-decoration: none;
}

.result-address a:hover {
  color: var(--accent);
}

.result-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.result-meta .price {
  color: var(--text);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.result-desc {
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.result-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 8px;
}

.tag {
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--tag-text);
  background: var(--tag-bg);
  padding: 2px 8px;
  border-radius: 3px;
  white-space: nowrap;
}

.empty-state {
  text-align: center;
  padding: 80px 0 40px;
  color: var(--text-secondary);
}

.empty-state p {
  font-size: 0.95rem;
  max-width: 360px;
  margin: 0 auto;
  line-height: 1.6;
}

.empty-state .hint {
  font-size: 0.82rem;
  margin-top: 16px;
  opacity: 0.7;
}

.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.stats {
  margin-top: 64px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  font-size: 0.78rem;
  color: var(--text-secondary);
  opacity: 0.6;
}

@media (max-width: 520px) {
  .container { padding-block: 48px 80px; }
  h1 { font-size: 1.8rem; }
  .search-form { flex-direction: column; }
  .search-btn { padding: 12px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>UMass Housing Search</h1>
    <p class="subtitle">Off-campus rentals across Amherst, Hadley, Sunderland, and beyond</p>
  </header>

  <form class="search-form" id="searchForm">
    <input
      class="search-input"
      type="text"
      id="queryInput"
      placeholder="Try parking, studio bus route, hadley 2 bedroom..."
      autocomplete="off"
      autofocus
    >
    <button class="search-btn" type="submit">Search</button>
  </form>

  <div id="results"></div>
</div>

<script>
var form = document.getElementById('searchForm');
var input = document.getElementById('queryInput');
var resultsEl = document.getElementById('results');

function showEmpty() {
  resultsEl.innerHTML =
    '<div class="empty-state">' +
      '<p>Search across 200+ rental listings from UMass Housing, Craigslist, Kamins, and Valley PM.</p>' +
      '<p class="hint">Results are ranked by relevance using TF-IDF scoring.</p>' +
    '</div>';
}

function showLoading() {
  resultsEl.innerHTML =
    '<div class="results-header"><span class="spinner"></span>Searching...</div>';
}

function showNoResults(query) {
  resultsEl.innerHTML =
    '<div class="empty-state">' +
      '<p>No listings matched <strong>' + escapeHtml(query) + '</strong></p>' +
      '<p class="hint">Try broader terms like "apartment" or "parking"</p>' +
    '</div>';
}

function escapeHtml(str) {
  var el = document.createElement('span');
  el.textContent = str;
  return el.innerHTML;
}

function parseNum(s) {
  if (!s) return 0;
  return parseInt(String(s).replace(/,/g, ''), 10) || 0;
}

function formatPrice(p) {
  var n = parseNum(p);
  if (n === 0) return '';
  return '$' + n.toLocaleString();
}

function formatBeds(b) {
  var n = parseNum(b);
  if (isNaN(n)) return '';
  if (n === 0) return 'Studio';
  return n + (n === 1 ? ' bed' : ' beds');
}

function formatBaths(b) {
  var n = parseNum(b);
  if (n === 0) return '';
  return n + (n === 1 ? ' bath' : ' baths');
}

function renderResults(results, query) {
  if (results.length === 0) {
    showNoResults(query);
    return;
  }

  var html = '<div class="results-header">' + results.length + ' listing' + (results.length !== 1 ? 's' : '') + ' for “' + escapeHtml(query) + '”</div>';
  html += '<div class="result-list">';

  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    var address = r.address || 'Address not listed';
    var price = formatPrice(r.price);
    var beds = formatBeds(r.bedrooms);
    var baths = formatBaths(r.bathrooms);
    var desc = r.description || '';
    var sourceUrl = r.sourceUrl || '#';

    var meta = [];
    if (price) meta.push('<span class="price">' + price + '/mo</span>');
    if (beds) meta.push(beds);
    if (baths) meta.push(baths);
    meta.push(escapeHtml(r.source));

    var tags = [];
    if (r.amenities) {
      var parts = r.amenities.split(',');
      for (var j = 0; j < parts.length && j < 4; j++) {
        var t = parts[j].trim();
        if (t.length > 0 && t.length < 30) {
          tags.push('<span class="tag">' + escapeHtml(t) + '</span>');
        }
      }
    }

    html += '<div class="result">';
    html += '<div class="result-address"><a href="' + escapeHtml(sourceUrl) + '" target="_blank" rel="noopener">' + escapeHtml(address) + '</a></div>';
    html += '<div class="result-meta">' + meta.join('<span aria-hidden="true">&middot;</span>') + '</div>';
    if (desc) html += '<div class="result-desc">' + escapeHtml(desc) + '</div>';
    if (tags.length) html += '<div class="result-tags">' + tags.join('') + '</div>';
    html += '</div>';
  }

  html += '</div>';
  resultsEl.innerHTML = html;
}

function doSearch() {
  var q = input.value.trim();
  if (!q) { showEmpty(); return; }

  showLoading();

  fetch('/search?q=' + encodeURIComponent(q) + '&limit=200')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var results = (data.results || []).filter(function(r) { return r != null; });
      renderResults(results, q);
    })
    .catch(function() {
      resultsEl.innerHTML =
        '<div class="empty-state"><p>Could not reach the server. Make sure CrawlManager is running.</p></div>';
    });
}

form.addEventListener('submit', function(e) {
  e.preventDefault();
  doSearch();
});

showEmpty();
</script>
</body>
</html>
